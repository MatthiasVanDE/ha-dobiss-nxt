name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff check
        run: ruff check custom_components tests
      - name: ruff format
        run: ruff format --check custom_components tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - name: pytest
        run: pytest tests --cov=custom_components/dobiss/api --cov-report=term-missing

  manifest:
    name: Manifest sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The manifest version must match the tag on a release
        run: |
          python - <<'PY'
          import json, os, sys
          manifest = json.load(open("custom_components/dobiss/manifest.json"))
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/").lstrip("v")
              if tag != manifest["version"]:
                  sys.exit(f"tag {tag} != manifest {manifest['version']}")
          print("manifest version:", manifest["version"])
          if manifest.get("requirements"):
              sys.exit("this integration is meant to have no requirements")
          PY
